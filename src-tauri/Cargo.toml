[package]
name = "mdpad"
version = "0.1.0"
description = "The terminal for your markdown"
authors = ["zentala"]
edition = "2024"

[lib]
name = "mdpad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-cli = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
walkdir = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
