name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: prototype/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: prototype
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: prototype
        run: pnpm build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./prototype/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create web build archive
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd prototype/dist
          zip -r ../../mdpad-v${{ steps.version.outputs.version }}-web.zip .

      - name: Extract changelog for this version
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          body=$(sed -n "/^## \[${version}\]/,/^## \[/p" CHANGELOG.md | head -n -1)
          echo "body<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: mdpad v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: mdpad-v${{ steps.version.outputs.version }}-web.zip
          draft: false
          prerelease: false

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./prototype/package.json').version")" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
